name: Check Keystore Fingerprint
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Decode base64 secret keystore and print ONLY its public fingerprint
        env:
          KB64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KB64" | tr -d ' \n\r' | base64 -d > /tmp/ks.keystore 2>/dev/null || true
          echo "----- fingerprint of ANDROID_KEYSTORE_BASE64 secret -----"
          keytool -list -v -keystore /tmp/ks.keystore -storepass "$KPASS" 2>/dev/null | grep -iE "Alias name|SHA1:|SHA-1|Valid from" || echo "could not read (wrong password or not a keystore)"
          rm -f /tmp/ks.keystore
