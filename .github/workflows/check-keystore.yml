name: Check Keystore Fingerprint
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Try to open the base64 secret keystore and print ONLY public fingerprint
        env:
          KB64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KB64" | tr -d ' \n\r' | base64 -d > /tmp/ks.keystore 2>/dev/null || true
          echo "decoded size: $(stat -c%s /tmp/ks.keystore 2>/dev/null) bytes"
          for PW in "$KPASS" "velour2024" "velour" "android" "Velour2024" "velour2025" "changeit"; do
            OUT=$(keytool -list -v -keystore /tmp/ks.keystore -storepass "$PW" 2>/dev/null | grep -iE "SHA1:|Valid from|Alias name")
            if [ -n "$OUT" ]; then
              echo "===== OPENED with a candidate password ====="
              echo "$OUT"
              break
            else
              echo "password candidate failed"
            fi
          done
          rm -f /tmp/ks.keystore
