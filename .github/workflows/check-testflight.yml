name: Check TestFlight Build Status
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query App Store Connect for recent build states
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip install pyjwt cryptography requests --quiet
          python3 - <<'PY'
          import os, time, base64, jwt, requests
          key = base64.b64decode(os.environ['ASC_KEY_BASE64']).decode()
          kid, iss = os.environ['ASC_KEY_ID'], os.environ['ASC_ISSUER_ID']
          tok = jwt.encode({'iss':iss,'iat':int(time.time()),'exp':int(time.time())+1000,'aud':'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid':kid,'typ':'JWT'})
          h = {'Authorization':'Bearer '+tok}
          B='https://api.appstoreconnect.apple.com/v1'
          apps = requests.get(B+'/apps?filter[bundleId]=com.velour.salon', headers=h).json()
          if not apps.get('data'):
              print('NO APP FOUND / errors:', apps.get('errors')); raise SystemExit
          appid = apps['data'][0]['id']
          print('APP id:', appid, apps['data'][0]['attributes'].get('bundleId'))
          r = requests.get(B+f'/builds?filter[app]={appid}&sort=-uploadedDate&limit=10&fields[builds]=version,processingState,uploadedDate,expired,usesNonExemptEncryption', headers=h).json()
          print('===== recent builds (newest first) =====')
          for x in r.get('data', []):
              a = x['attributes']
              print(f"build {a.get('version'):>6} | state={a.get('processingState'):<12} | uploaded={a.get('uploadedDate')} | expired={a.get('expired')} | enc={a.get('usesNonExemptEncryption')}")
          if r.get('errors'): print('ERRORS:', r['errors'])
          PY
