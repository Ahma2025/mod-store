name: Check TestFlight Build Status
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query per-build beta detail directly
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip install pyjwt cryptography requests --quiet
          python3 - <<'PY'
          import os, time, base64, jwt, requests
          key=base64.b64decode(os.environ['ASC_KEY_BASE64']).decode()
          kid,iss=os.environ['ASC_KEY_ID'],os.environ['ASC_ISSUER_ID']
          tok=jwt.encode({'iss':iss,'iat':int(time.time()),'exp':int(time.time())+1000,'aud':'appstoreconnect-v1'},key,algorithm='ES256',headers={'kid':kid,'typ':'JWT'})
          h={'Authorization':'Bearer '+tok}; B='https://api.appstoreconnect.apple.com/v1'
          appid=requests.get(B+'/apps?filter[bundleId]=com.velour.salon',headers=h).json()['data'][0]['id']
          builds=requests.get(B+f'/builds?filter[app]={appid}&sort=-uploadedDate&limit=5&fields[builds]=version,processingState',headers=h).json()['data']
          # beta groups on the app
          grps=requests.get(B+f'/apps/{appid}/betaGroups?fields[betaGroups]=name,isInternalGroup&limit=20',headers=h).json()
          print('BETA GROUPS:', [(g['attributes']['name'], 'internal' if g['attributes']['isInternalGroup'] else 'EXTERNAL') for g in grps.get('data',[])])
          for b in builds:
              bid=b['id']; v=b['attributes']['version']
              d=requests.get(B+f'/builds/{bid}/buildBetaDetail?fields[buildBetaDetails]=internalBuildState,externalBuildState',headers=h).json()
              a=d.get('data',{}).get('attributes',{})
              g=requests.get(B+f'/builds/{bid}/betaGroups?fields[betaGroups]=name',headers=h).json()
              groups=[x['attributes']['name'] for x in g.get('data',[])]
              print(f"build {v:>4} | internal={a.get('internalBuildState')} | external={a.get('externalBuildState')} | inGroups={groups}")
          PY
